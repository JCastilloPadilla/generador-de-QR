<VirtualHost *:80>
    ServerName qr.ccastillo.dev
    DocumentRoot /var/www/qr.ccastillo.dev/public_html
    ServerSignature Off

    Include /etc/apache2/qr.ccastillo.dev-security.conf

    ErrorLog ${APACHE_LOG_DIR}/qr.ccastillo.dev_error.log
    CustomLog ${APACHE_LOG_DIR}/qr.ccastillo.dev_access.log combined

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://qr.ccastillo.dev%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
