<Directory /var/www/qr.ccastillo.dev/public_html>
    Options -Indexes -Includes -ExecCGI -FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    <FilesMatch "(?i)(^\.|~$|\.(env|ini|log|sql|bak|old|orig|swp|pem|key|php[0-9]?|phtml|phar)$)">
        Require all denied
    </FilesMatch>

    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>

<Directory /var/www/qr.ccastillo.dev/public_html/assets>
    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>

# Permitir ACME, sin exponer otros directorios ocultos.
RedirectMatch 404 "(?i)/\.(?!well-known(?:/|$))"
