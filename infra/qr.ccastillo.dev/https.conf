<VirtualHost *:443>
    ServerName qr.ccastillo.dev
    DocumentRoot /var/www/qr.ccastillo.dev/public_html
    ServerSignature Off

    Include /etc/apache2/qr.ccastillo.dev-security.conf
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/qr.ccastillo.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/qr.ccastillo.dev/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/qr.ccastillo.dev_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/qr.ccastillo.dev_ssl_access.log combined
</VirtualHost>
